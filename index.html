const D={"chapters":["Correspondências ocultas","Respiração controlada","Meditação","Visualização","Concentração","Dramatização","Encantamento","Realização","Aura","Visão divinatória","Canalização","Projeção astral"],"tyson":[{"id":"t-1.1","number":"1.1","chapter":1,"title":"Guia animal","originalTitle":"Animal Guide","guide":"Escolha intuitivamente um animal que represente aspectos seus; visualize sua aparência, movimentos e um encontro respeitoso.","minutes":12,"type":"tyson"},{"id":"t-1.2","number":"1.2","chapter":1,"title":"Lugar pessoal","originalTitle":"Personal Space","guide":"Visite um lugar onde se sente em casa; observe detalhes, sons e temperatura e depois reconstrua-o mentalmente.","minutes":12,"type":"tyson"},{"id":"t-1.3","number":"1.3","chapter":1,"title":"Meditação cromática","originalTitle":"Color Meditation","guide":"Escolha uma cor significativa e imagine-a preenchendo gradualmente o campo de visão e o espaço ao redor.","minutes":10,"type":"tyson"},{"id":"t-1.4","number":"1.4","chapter":1,"title":"Respostas aos aromas","originalTitle":"Scent Responses","guide":"Experimente um aroma por sessão; observe as imagens e emoções associadas e compare os registros em dias diferentes.","minutes":12,"type":"tyson"},{"id":"t-1.5","number":"1.5","chapter":1,"title":"Imagens musicais","originalTitle":"Music Imagery","guide":"Ouça uma peça instrumental, acompanhe suas imagens espontâneas e registre como variam entre compositores.","minutes":12,"type":"tyson"},{"id":"t-1.6","number":"1.6","chapter":1,"title":"Associações pessoais","originalTitle":"Personal Symbolic Associations","guide":"Evite interpretações prontas: identifique objetos ou imagens com significado biográfico e associe cada um a lembranças e sensações.","minutes":12,"type":"tyson"},{"id":"t-1.7","number":"1.7","chapter":1,"title":"Vínculos simbólicos","originalTitle":"Symbolic Links","guide":"Pense em uma pessoa conhecida e deixe emergir objetos que simbolizem qualidades dela; observe sem concluir que sejam fatos ocultos.","minutes":10,"type":"tyson"},{"id":"t-1.8","number":"1.8","chapter":1,"title":"Sigilo pessoal","originalTitle":"Personal Sigil","guide":"Visualize seu nome escrito e reorganize seus traços até construir uma forma gráfica que represente sua identidade.","minutes":15,"type":"tyson"},{"id":"t-1.9","number":"1.9","chapter":1,"title":"Estrela guia","originalTitle":"Guiding Star","guide":"Observe o céu noturno, escolha uma estrela que lhe desperte afinidade e investigue as associações pessoais que projeta nela.","minutes":12,"type":"tyson"},{"id":"t-1.10","number":"1.10","chapter":1,"title":"Nome mágico","originalTitle":"Magic Name","guide":"Formule um nome ritual pessoal que sintetize aspirações e qualidades escolhidas, registrando sua origem e significado.","minutes":15,"type":"tyson"},{"id":"t-2.1","number":"2.1","chapter":2,"title":"Respiração silenciosa","originalTitle":"Silent Breath","guide":"Observe a passagem do ar, reduzindo ruídos sem forçar a ventilação; note movimento corporal e regularidade.","minutes":10,"type":"tyson"},{"id":"t-2.2","number":"2.2","chapter":2,"title":"Inspiração com retenção","originalTitle":"Inhalation with Retention","guide":"Experimente uma breve pausa após inspirar, observando esforço e conforto; não busque recordes nem prolongue a pausa em desconforto.","minutes":10,"type":"tyson"},{"id":"t-2.3","number":"2.3","chapter":2,"title":"Expiração com pausa","originalTitle":"Exhalation with Exclusion","guide":"Após expirar, faça uma pausa confortável antes da inspiração seguinte e observe a transição entre ciclos.","minutes":10,"type":"tyson"},{"id":"t-2.4","number":"2.4","chapter":2,"title":"Inspiração audível","originalTitle":"Audible Inhalation","guide":"Explore a percepção do som ao inspirar e acompanhe como a vibração modifica seu foco.","minutes":10,"type":"tyson"},{"id":"t-2.5","number":"2.5","chapter":2,"title":"Expiração audível","originalTitle":"Audible Exhalation","guide":"Produza conscientemente o som da expiração e acompanhe seu início, duração e final.","minutes":10,"type":"tyson"},{"id":"t-2.6","number":"2.6","chapter":2,"title":"Respiração A–O","originalTitle":"A-O Breating","guide":"Combine inspiração e expiração com os fonemas A e O, percebendo ressonância e alteração de qualidade vocal.","minutes":12,"type":"tyson"},{"id":"t-2.7","number":"2.7","chapter":2,"title":"Respiração das vogais","originalTitle":"Vowel Breathing","guide":"Percorra vogais em diferentes registros vocais, notando sensações corporais e estados de atenção.","minutes":12,"type":"tyson"},{"id":"t-2.8","number":"2.8","chapter":2,"title":"Fole respiratório","originalTitle":"Working the Bellows","guide":"Explore o padrão respiratório de fole descrito por Tyson em série breve e sem esforço; interrompa se houver vertigem.","minutes":8,"type":"tyson"},{"id":"t-2.9","number":"2.9","chapter":2,"title":"Respiração da morte","originalTitle":"Death Breathing","guide":"Experimente o contraste simbólico entre esvaziamento, quietude e retomada do ar, sem buscar privação prolongada.","minutes":10,"type":"tyson"},{"id":"t-2.10","number":"2.10","chapter":2,"title":"Respiração do dragão","originalTitle":"Dragon Breaths","guide":"Articule gesto, sopro e imagem de exalação dirigida, mantendo o esforço compatível com seu conforto.","minutes":12,"type":"tyson"},{"id":"t-3.1","number":"3.1","chapter":3,"title":"Relaxamento escalonado","originalTitle":"Stepped Relaxation","guide":"Solte progressivamente grupos musculares, percorrendo o corpo com atenção ordenada.","minutes":15,"type":"tyson"},{"id":"t-3.2","number":"3.2","chapter":3,"title":"Auditoria mental","originalTitle":"Auditing","guide":"Observe a sucessão de pensamentos sem segui-los nem reagir; registre as distrações mais recorrentes.","minutes":12,"type":"tyson"},{"id":"t-3.3","number":"3.3","chapter":3,"title":"Consciência da respiração","originalTitle":"Breath Awareness","guide":"Use cada ciclo respiratório como âncora da atenção e retorne a ele após divagações.","minutes":12,"type":"tyson"},{"id":"t-3.4","number":"3.4","chapter":3,"title":"Mantra ômega","originalTitle":"Omega Mantra","guide":"Repita mentalmente ou em voz baixa o mantra indicado, observando ritmo, repetição e estabilidade da atenção.","minutes":12,"type":"tyson"},{"id":"t-3.5","number":"3.5","chapter":3,"title":"Mandala","originalTitle":"Mandala","guide":"Contemple uma mandala e depois procure reconstituir sua simetria com os olhos fechados.","minutes":12,"type":"tyson"},{"id":"t-3.6","number":"3.6","chapter":3,"title":"Mudra","originalTitle":"Mudra","guide":"Adote um gesto de mãos como sinal de concentração e observe como ele modifica a qualidade da prática.","minutes":10,"type":"tyson"},{"id":"t-3.7","number":"3.7","chapter":3,"title":"Consciência corporal","originalTitle":"Body Awareness","guide":"Percorra sensações de diferentes partes do corpo sem buscar alterá-las; distinga percepção de interpretação.","minutes":12,"type":"tyson"},{"id":"t-3.8","number":"3.8","chapter":3,"title":"Contemplação","originalTitle":"Contemplation","guide":"Escolha uma ideia, forma ou imagem e permaneça com ela, permitindo associações sem perder o tema central.","minutes":12,"type":"tyson"},{"id":"t-3.9","number":"3.9","chapter":3,"title":"Oração","originalTitle":"Prayer","guide":"Elabore uma prece ou invocação pessoal e observe os efeitos do ritmo, das palavras e da postura.","minutes":12,"type":"tyson"},{"id":"t-3.10","number":"3.10","chapter":3,"title":"Orientação espiritual","originalTitle":"Spiritual Guidance","guide":"Formule uma questão e realize uma meditação receptiva; registre respostas como material simbólico pessoal.","minutes":12,"type":"tyson"},{"id":"t-4.1","number":"4.1","chapter":4,"title":"Objetos imóveis","originalTitle":"Visualizing Static Objects","guide":"Observe um objeto e recrie mentalmente sua forma, textura, cor e iluminação.","minutes":12,"type":"tyson"},{"id":"t-4.2","number":"4.2","chapter":4,"title":"Formas mentais","originalTitle":"Visualizing Mental Shapes","guide":"Construa uma figura geométrica simples na imaginação e mantenha suas proporções estáveis.","minutes":12,"type":"tyson"},{"id":"t-4.3","number":"4.3","chapter":4,"title":"Objetos em movimento","originalTitle":"Visualizing Moving Objects","guide":"Visualize uma forma que se desloca ou gira, preservando volume, continuidade e direção.","minutes":12,"type":"tyson"},{"id":"t-4.4","number":"4.4","chapter":4,"title":"Rostos humanos","originalTitle":"Visualizing Human Faces","guide":"Recrie um rosto conhecido e examine detalhes, expressão e mudanças de ângulo.","minutes":12,"type":"tyson"},{"id":"t-4.5","number":"4.5","chapter":4,"title":"Lugares","originalTitle":"Visualizing Places","guide":"Construa mentalmente um espaço e percorra seus pontos de referência sem perder a organização espacial.","minutes":15,"type":"tyson"},{"id":"t-4.6","number":"4.6","chapter":4,"title":"Pessoa falando","originalTitle":"Visualizing a Person Talking","guide":"Imagine alguém conversando, coordenando expressão facial, gestos, voz e movimento dos lábios.","minutes":12,"type":"tyson"},{"id":"t-4.7","number":"4.7","chapter":4,"title":"Multidão","originalTitle":"Visualizing a Crowd","guide":"Visualize várias pessoas interagindo num ambiente, mantendo relações espaciais coerentes.","minutes":12,"type":"tyson"},{"id":"t-4.8","number":"4.8","chapter":4,"title":"Figura desconhecida","originalTitle":"Visualizing an Unfamiliar Figure","guide":"Crie uma personagem inédita e observe sua forma, movimentos e características emergentes.","minutes":12,"type":"tyson"},{"id":"t-4.9","number":"4.9","chapter":4,"title":"Fluxo de energia","originalTitle":"Visualizing Energy Flowing","guide":"Imagine luminosidade percorrendo uma trajetória corporal e registre as sensações e imagens associadas.","minutes":12,"type":"tyson"},{"id":"t-4.10","number":"4.10","chapter":4,"title":"Respiração visualizada","originalTitle":"Visualizing Your Breath","guide":"Associe uma imagem móvel ao ciclo respiratório, acompanhando as mudanças entre inspirar e expirar.","minutes":12,"type":"tyson"},{"id":"t-5.1","number":"5.1","chapter":5,"title":"Concentração numa pedra","originalTitle":"Concentration on a Stone","guide":"Observe uma pedra em detalhe e mantenha a atenção no objeto, notando retornos após distrações.","minutes":12,"type":"tyson"},{"id":"t-5.2","number":"5.2","chapter":5,"title":"Chama de vela","originalTitle":"Concentration on a Candle Flame","guide":"Contemple uma chama brevemente e observe oscilações de atenção sem aproximar-se do fogo.","minutes":10,"type":"tyson"},{"id":"t-5.3","number":"5.3","chapter":5,"title":"Eu na chama","originalTitle":"Projection of Self into a Candle Flame","guide":"Use a chama como âncora e imagine uma mudança de perspectiva para o interior dela.","minutes":12,"type":"tyson"},{"id":"t-5.4","number":"5.4","chapter":5,"title":"Alongamento da chama","originalTitle":"Lengthening a Candle Flame","guide":"Imagine a chama ficando mais alta sem afirmar que sua aparência física se alterou; compare imaginação e observação.","minutes":12,"type":"tyson"},{"id":"t-5.5","number":"5.5","chapter":5,"title":"Fumaça de incenso","originalTitle":"Concentration on Incense Smoke","guide":"Acompanhe a trajetória e as formas da fumaça mantendo o foco contínuo; utilize ambiente ventilado.","minutes":12,"type":"tyson"},{"id":"t-5.6","number":"5.6","chapter":5,"title":"Relógio audível","originalTitle":"Concentration on a Ticking Clock","guide":"Concentre-se no tique-taque, detectando distrações e retomando o som escolhido.","minutes":12,"type":"tyson"},{"id":"t-5.7","number":"5.7","chapter":5,"title":"Observação do relógio","originalTitle":"Clock Watching","guide":"Observe o movimento de um relógio como objeto temporal, mantendo atenção à continuidade.","minutes":12,"type":"tyson"},{"id":"t-5.8","number":"5.8","chapter":5,"title":"Tetragrama","originalTitle":"Concentration on the Tetragram","guide":"Contemple a figura do tetragrama descrita por const empty=()=>({version:3,tysonDone:{},mmmDone:{},reviews:{},ops:{},logs:[],started:null,created:now()});

function migrate(x){let n=empty();if(!x||x.version!==1||!Array.isArray(x.logs))throw Error('Estrutura V2 inválida');
 for(const [id,value] of Object.entries(x.completed||{})){let k=v2id(id);if(k)n.tysonDone[k]={date:typeof value==='string'?value:now(),rating:3}}
 for(const l of x.logs){let ref=v2id(l.lessonId);n.logs.push({id:l.id||uniq(),kind:ref?(l.type==='review'?'review':'tyson'):'legacy',ref:ref||l.lessonId||'v2',at:l.when||now(),note:l.note||'',rating:Math.round(Number(l.scores?.atencao||3)),origin:'Limiar 2'});}
 for(const [id,r] of Object.entries(x.reviews||{})){let k=v2id(id);if(k)n.reviews[k]={due:r?.due||today(),stage:r?.stage||0}}
 return n;}

function home(){let next=nextLesson();return `<div class="hero"><div class="eyebrow">Currículo integral · v3.0</div><h1>O laboratório começa no limiar.</h1><p>Um currículo que une os 120 exercícios de Donald Tyson, as competências do Liber MMM e as 25 operações do Liber KKK. Exercício e operação têm registros e critérios diferentes.</p><div class="row"><button class="btn" data-act="open" data-id="${next.id}">Continuar formação · ${next.number} →</button><button class="btn secondary" data-act="nav" data-id="kkk">Explorar operações</button></div></div><div class="stats"><div class="stat"><b>${nDone()}/120</b><small>Exercícios de Tyson</small></div><div class="stat"><b>${nMmm()}/8</b><small>Complementos MMM</small></div><div class="stat"><b>${nOps()}/25</b><small>Operações concluídas</small></div></div><div class="section"><h2>Arquitetura</h2></div><div class="grid2"><article class="item"><span class="chip gold">01 · Formação</span><h3>Treinar competências</h3><p>12 capítulos, 10 exercícios cada. A sequência é sugerida, mas nenhum exercício fica escondido por bloqueio artificial.</p><button class="btn secondary" data-act="nav" data-id="tyson">Ver 120 exercícios</button></article><article class="item"><span class="chip violet">02 · Consolidação</span><h3>Eliminar repetições</h3><p>16 competências identificadas no MMM: 8 com equivalência em Tyson e 8 complementos próprios.</p><button class="btn secondary" data-act="nav" data-id="mmm">Ver correspondências</button></article><article class="item"><span class="chip mint">03 · Operação</span><h3>Construir e verificar</h3><p>25 conjurações organizadas em cinco níveis. Cada operação pode receber múltiplas tentativas e resultados.</p><button class="btn secondary" data-act="nav" data-id="kkk">Abrir Liber KKK</button></article><article class="item"><span class="chip">Acompanhamento</span><h3>Recuperar e documentar</h3><p>${due()} revisões vencidas no momento. Backup JSON e importação de registros antigos estão disponíveis.</p><but function mmm(){let groups=[...new Set(M.map(x=>x.group))];return `<div class="eyebrow">Transição sem redundância</div><h1 class="page-title">Liber MMM · Consolidação.</h1><p class="lead">As competências já cobertas pelo curso de Tyson são reconhecidas; não há uma segunda lição obrigatória para o mesmo exercício. As práticas distintas permanecem acessíveis.</p><div class="stats"><div class="stat"><b>16</b><small>Competências mapeadas</small></div><div class="stat"><b>8</b><small>Equivalentes em Tyson</small></div><div class="stat"><b>${nMmm()}/8</b><small>Complementos realizados</small></div></div>${groups.map(g=>`<div class="section"><h2>${esc(g)}</h2></div>${M.filter(x=>x.group===g).map(x=>`<article class="item"><div class="row"><span class="chip ${x.mode==='mapped'?'mint':'violet'}">${x.mode==='mapped'?'Integrado a Tyson':db.mmmDone[x.id]?'Complemento realizado':'Complemento próprio'}</span>${x.mode==='new'?`<button class="btn ${db.mmmDone[x.id]?'secondary':''}" data-act="open" data-id="${x.id}">${db.mmmDone[x.id]?'Repetir':'Praticar'} →</button>`:''}</div><h3>${esc(x.title)}</h3><p>${esc(x.guide)}</p>${chips(x.refs)}</article>`).join('')}`).join('')}<div class="note">Esta lista é uma matriz de competências elaborada para o aplicativo, não a numeração de exercícios atribuída por Carroll ao Liber MMM. A equivalência indica sobreposição pedagógica, não identidade literal entre técnicas.</div>`}
function levelUnlocked(l){return l===1||K.filter(k=>k.level===l-1).every(k=>db.ops[k.id]?.completed)}
function kkk(){let ks=K.filter(x=>x.level===level);return `<div class="eyebrow">Modo operação · Peter J. Carroll</div><h1 class="page-title">Liber KKK · 25 operações.</h1><p class="lead">Cinco atos × cinco níveis. Dentro de cada nível, as operações podem ser realizadas em qualquer ordem. A mudança de nível exige que as cinco operações anteriores sejam finalizadas. O programa original prevê pelo menos um ano.</p><div class="row"><span class="chip gold">${nOps()}/25 operações finalizadas</span><span class="small muted">${db.started?'Início registrado: '+dateFmt(db.started):'Programa ainda não iniciado'}</span></div><div class="tabs">${D.kkk.filter(x=>x.number%5===1).map(x=>{let l=x.level;return `<button class="${level===l?'active':''}" data-act="level" data-id="${l}">${l}. ${esc(x.levelTitle)} ${levelUnlocked(l)?'':'· restrito'}</button>`}).join('')}</div><div class="note">${level===5?'Alta Magia: as cinco operações têm nomes e funções, mas Carroll deliberadamente não fornece procedimentos. Os espaços de planejamento são abertos e autorais.':levelUnlocked(level)?'Nível disponível: registre plano, tentativas, observações e resultados antes de encerrar cada operação.':'Este nível pode ser consultado, mas novas operações são liberadas após concluir as cinco do nível anterior.'}</div>${ks.map(k=>{const p=db.ops[k.id]||{};const count=db.logs.filter(l=>l.kind==='operation'&&l.ref===k.id).length;return `<article class="item"><div class="row"><span class="chip ${p.completed?'mint':'gold'}">Conjuração ${k.number} · ${esc(k.act)}</span><span class="small ${p.completed?'status':'muted'}">${p.completed?'✓ Finalizada':count+' registros'}</span></div><h3>${esc(k.title)}</h3><p>${esc(k.guide)}</p><div class="row">${chips(k.refs)}<button class="btn ${levelUnlocked(k.level)?'':'secondary'}" data-act="open" data-id="${k.id}">${levelUnlocked(k.level)?'Abrir operação':'Consultar'} →</button></div></article>`}).join('')}<div class="note">O aplicativo conserva tentativas malsucedidas e resultados não confirmados, além de êxitos. Isso difere do livro de sucessos recomendado por Carroll, mas permite avaliação mais criteriosa dos registros.</div>`}
function detailTyson(t){return `<button class="btn secondary" data-act="nav" data-id="tyson">← Voltar aos 120 exercícios</button><div class="detail"><div class="contenthead"><span class="chip gold">Exercício ${t.number}</span><span class="chip">${t.minutes} min sugeridos</span>${db.tysonDone[t.id]?'<span class="chip mint">Já realizado</span>':''}</div><h1 class="page-title">${esc(t.title)}</h1><p class="small muted">Donald Tyson · capítulo ${t.chapter}: ${esc(D.chapters[t.chapter-1])} · ${esc(t.originalTitle)}</p><div class="stage"><strong>01 · Preparação</strong><p>Escolha um local adequado e reúna objetos necessários à prática. Reserve aproximadamente ${t.minutes} minutos. Defina antes o que pretende observar.</p></div><div class="stage"><strong>02 · Exercício</strong><p>${esc(t.guide)}</p></div><div class="stage"><strong>03 · Registro e contraste</strong><p>Descreva o que aconteceu, o que foi imaginado e o que permaneceu difícil. Distinga percepções diretas, interpretações e expectativas. Anote mudanças para a próxima tentativa.</p></div>${timerUI(t.minutes)}<div class="note">Adaptação autoral resumida do exercício ${t.number} de <i>Before You Do Magic</i>. Para o procedimento integral e suas particularidades, consulte o capítulo correspondente. A duração indicada é curricular, não uma prescrição do autor.${t.chapter===2?' Retenções e padrões respiratórios intensos não devem ser prolongados contra sinais de desconforto.':''}${t.number==='8.6'?' Esta atividade não é uma técnica de controle médico de hemorragia.':''}</div>${recordForm('tyson',t.id)}</div>`}
function detailMmm(m){return `<button class="btn secondary" data-act="nav" data-id="mmm">← Voltar ao Liber MMM</button><div class="detail"><span class="chip violet">Complemento MMM</span><h1 class="page-title" style="margin-top:12px">${esc(m.title)}</h1><p class="small muted">Peter J. Carroll · ${esc(m.group)}</p><div class="stage"><strong>01 · Preparar</strong><p>Escolha uma situação adequada e decida que aspecto da prática será observado, evitando metas de desempenho absoluto.</p></div><div class="stage"><strong>02 · Executar</strong><p>${esc(m.guide)}</p></div><div class="stage"><strong>03 · Comparar</strong><p>Registre o que ocorreu, a repetibilidade e como essa técnica amplia ou modifica o repertório de Tyson.</p></div>${timerUI(m.minutes)}<div class="section"><h2>Pré-requisitos relacionados</h2></div>${chips(m.refs)}${recordForm('mmm',m.id)}</div>`}
function timerUI(n){if(selected?.minutes!==n){minutes=n;remain=n*60}return `<div class="timer"><div><div class="tiny muted">Cronômetro opcional</div><time id="clock">${fmtTime(remain)}</time></div><div class="timer-actions"><button class="btn secondary" data-act="timer-toggle">${ticking?'Pausar':'Iniciar'}</button><button class="btn secondary" data-act="timer-reset">Reiniciar</button></div></div>`}
function fmtTime(n){return String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0')}
function recordForm(kind,id){return `<div class="section"><h2>Registro da experiência</h2></div><form id="practice-form" data-kind="${kind}" data-ref="${id}"><div class="field"><label for="practice-notes">O que aconteceu concretamente?</label><textarea class="textarea" id="practice-notes" minlength="10" placeholder="Descreva execução, imagens, dificuldades, sensações e limites da interpretação…" required></textarea></div><div class="field"><label>Qualidade percebida da atenção (1–5)</label><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rate" data-id="${n}" class="${rate===n?'selected':''}" aria-label="Avaliação ${n} de 5">${n}</button>`).join('')}</div></div><button type="submit" class="btn">Registrar prática · +20 XP local</button></form>`}
function detailKkk(k){let p=db.ops[k.id]||{},unlocked=levelUnlocked(k.level),logs=db.logs.filter(l=>l.kind==='operation'&&l.ref===k.id).sort((a,b)=>b.at.localeCompare(a.at));return `<button class="btn secondary" data-act="nav" data-id="kkk">← Voltar às operações</button><div class="detail"><div class="contenthead"><span class="chip gold">Conjuração ${k.number}</span><span class="chip">Nível ${k.level} · ${esc(k.levelTitle)}</span>${p.completed?'<span class="chip mint">Concluída</span>':''}</div><h1 class="page-title">${esc(k.act)}</h1><p class="lead">${esc(k.guide)}</p>${!unlocked?'<div class="note">Consulta disponível. O registro desta operação será liberado ao completar as cinco conjurações do nível anterior.</div>':''}${k.open?'<div class="note">O método não foi prescrito por Carroll. A descrição é apenas uma proposta de documentação autoral, não uma técnica atribuída ao livro.</div>':''}<div class="section"><h2>Planejamento da operação</h2></div><form id="plan-form"><div class="field"><label for="op-goal">Intenção / problema delimitado</label><textarea id="op-goal" class="textarea" ${unlocked?'':'disabled'} placeholder="O que pretende explorar ou transformar?">${esc(p.goal||'')}</textarea></div><div class="field"><label for="op-criteria">Critérios de observação e verificação</label><textarea id="op-criteria" class="textarea" ${unlocked?'':'disabled'} placeholder="Que resultado observaria? Qual seria uma explicação alternativa?">${esc(p.criteria||'')}</textarea></div><button class="btn secondary" ${unlocked?'':'disabled'} type="submit">Salvar planejamento</button></form><div class="section"><h2>Diário da operação</h2><span class="small muted">${logs.length} entradas</span></div>${unlocked?`<form id="op-log-form"><div class="field"><label for="op-type">Tipo de registro</label><select class="select" id="op-type"><option value="tentativa">Tentativa ou execução</option><option value="observacao">Observação</option><option value="resultado">Resultado e avaliação</option></select></div><div class="field"><label for="op-note">Descrição</label><textarea class="textarea" id="op-note" minlength="12" required placeholder="Registre método, circunstâncias, resultado e possibilidade de coincidência…"></textarea></div><div class="field"><label for="op-outcome">Avaliação do resultado</label><select class="select" id="op-outcome"><option value="indeterminado">Indeterminado / não verificável</option><option value="nao">Não ocorreu</option><option value="subjetivo">Experiência subjetiva relevante</option><option value="observado">Resultado observável registrado</option></select></div><button class="btn" type="submit">Adicionar ao diário da operação</button></form>`:''}${logs.length?logs.map(l=>`<div class="log"><div class="log-head"><strong class="small">${esc(({tentativa:'Tentativa',observacao:'Observação',resultado:'Resultado'}[l.event]||'Registro'))}</strong><span class="tiny muted">${dateFmt(l.at)}</span></div><p>${esc(l.note)}</p><span class="chip">${esc(({indeterminado:'Indeterminado',nao:'Não ocorreu',subjetivo:'Subjetivo',observado:'Observável'}[l.outcome]||'Sem avaliação'))}</span></div>`).join(''):'<p class="small muted">Nenhuma tentativa documentada.</p>'}<div class="section"><h2>Fechamento</h2></div><div class="note">Critério editorial: para finalizar, registre ao menos uma tentativa e um resultado classificado como experiência relevante ou observação documentada. Isso não comprova causalidade mágica. A conclusão integral do percurso exige ao menos um ano desde o início registrado, como recomenda Carroll.</div><button class="btn ${p.completed?'secondary':''}" data-act="op-complete" ${!unlocked?'disabled':''}>${p.completed?'Reabrir operação':'Marcar operação como concluída'}</button></div>`}
function renderDiary(){const entries=[...db.logs].sort((a,b)=>(b.at||'').localeCompare(a.at||''));return `<div class="eyebrow">Registros originais e restaurados</div><h1 class="page-title">Diário de campo.</h1><p class="lead">Um arquivo integral: acertos, dificuldades, tentativas e interpretações. Nenhuma tentativa desaparece por não ter produzido um resultado esperado.</p><div class="stats"><div class="stat"><b>${entries.length}</b><small>Registros totais</small></div><div class="stat"><b>${entries.filter(l=>l.kind==='operation').length}</b><small>Registros KKK</small></div><div class="stat"><b>${entries.filter(l=>l.kind==='review').length}</b><small>Revisões</small></div></div>${entries.length?entries.map(l=>{let o=T.find(t=>t.id===l.ref)||M.find(t=>t.id===l.ref)||K.find(t=>t.id===l.ref);return `<div class="item"><div class="row"><b>${esc(o?.title||l.ref||'Registro legado')}</b><span class="tiny muted">${dateFmt(l.at)}</span></div><span class="chip">${esc(({tyson:'Exercício',mmm:'MMM',operation:'KKK',review:'Revisão',legacy:'Legado'}[l.kind]||'Prática'))}</span><p style="white-space:pre-wrap">${esc(l.note)}</p><button class="btn secondary" data-act="open" data-id="${esc(o?.id||'')}">Abrir origem →</button></div>`}).join(''):'<div class="empty">O diário está vazio. Execute e registre a primeira atividade para começar.</div>'}`}
function renderReview(){let items=T.filter(t=>db.tysonDone[t.id]&&db.reviews[t.id]);let upcoming=items.sort((a,b)=>(db.reviews[a.id].due||'').localeCompare(db.reviews[b.id].due||''));return `<div class="eyebrow">Retomadas</div><h1 class="page-title">Revisões espaçadas.</h1><p class="lead">Após uma prática, uma revisão é programada. Avalie a recuperação; o intervalo é ajustado sem penalizar sessões perdidas.</p><div class="stats"><div class="stat"><b>${due()}</b><small>Revisões vencidas</small></div><div class="stat"><b>${upcoming.length}</b><small>Práticas na agenda</small></div><div class="stat"><b>${db.logs.filter(l=>l.kind==='review').length}</b><small>Retomadas feitas</small></div></div>${upcoming.length?upcoming.map(t=>`<div class="item"><div class="row"><div><strong>${esc(t.number)} · ${esc(t.title)}</strong><p>Próxima revisão: ${esc(db.reviews[t.id].due)}</p></div><button class="btn ${db.reviews[t.id].due<=today()?'':'secondary'}" data-act="review-open" data-id="${t.id}">Revisar</button></div></div>`).join(''):'<div class="empty">Pratique primeiro um exercício de Tyson para abrir sua agenda de revisões.</div>'}`}
function renderSettings(){return `<div class="eyebrow">Portabilidade e método</div><h1 class="page-title">Dados e fontes.</h1><p class="lead">O Limiar funciona sem conta. O histórico fica neste navegador; um arquivo de backup permite migração entre aparelhos e versões.</p><div class="item"><h3>Backup e restauração</h3><p>Exporte todos os registros em JSON. Também é possível importar backups compatíveis do Limiar 2 (16 lições). Os dados antigos não são apagados automaticamente.</p><div class="controls"><button class="btn" data-act="export">Exportar meus dados</button><button class="btn secondary" data-act="import">Importar backup JSON</button><input type="file" accept=".json,application/json" id="import-file" class="visually-hidden"></div><button class="btn red" data-act="reset">Apagar apenas os dados desta versão</button></div><div class="item"><h3>Textos de referência</h3><p>Donald Tyson, <i>Before You Do Magic: Train Your Mind to Awaken Occult Skills</i> (2025), capítulos 1–12. As 120 entradas correspondem exatamente à numeração presente no EPUB anexado pelo usuário.</p><p>Peter J. Carroll, <i>Liber Null & Psychonaut</i>, seção Liber MMM; <i>Liber Kaos</i>, seção Liber KKK. Para consulta textual: <a href="https://caotize.se/texto/liber-mmm-peter-carroll/" target="_blank" rel="noopener">Liber MMM</a> e <a href="https://caotize.se/texto/liber-kkk-peter-carroll/" target="_blank" rel="noopener">Liber KKK</a>.</p><p>Os guias são resumos autorais de uso didático, não traduções integrais. Os tempos, avaliações, equivalências, revisões e critérios de registro foram estabelecidos para este aplicativo.</p></div><div class="item"><h3>Critérios de segurança e validade</h3><p>Não há supressão geral das práticas respiratórias. Técnicas de retenção, fole e exalação vigorosa são identificadas individualmente e devem ser interrompidas em caso de desconforto. Encantamentos de cura não substituem cuidados médicos; exercícios de percepção, influência externa e divinação não são instrumentos de evidência sobrenatural.</p><p>Evite privação de sono, hiperventilação prolongada e atividades perigosas para intensificar práticas. O diário separa observação e interpretação.</p></div><div class="note">Versão ${D.version}. Progressão de Tyson: livre por atividade e sugerida por sequência. Liber KKK: nível ordenado, operações livres dentro do nível. Início do KKK em ${db.started?dateFmt(db.started):'data ainda não registrada'}.</div>`}
let reviewRef=null;
function renderReviewDetail(t){return `<button class="btn secondary" data-act="nav" data-id="review">← Agenda</button><div class="detail"><span class="chip">Revisão · ${t.number}</span><h1 class="page-title">${esc(t.title)}</h1><div class="stage"><strong>Recuperar sem consultar</strong><p>Tente lembrar a sequência de execução, o propósito do exercício e a experiência anterior. Registre o que conseguiu recuperar; se necessário, retorne à lição ao final.</p></div><form id="review-form"><div class="field"><label for="review-notes">O que recordou? O que precisou consultar?</label><textarea class="textarea" id="review-notes" required minlength="8"></textarea></div><div class="field"><label for="review-grade">Dificuldade da recuperação</label><select id="review-grade" class="select"><option value="1">Difícil — recuperar em 1 dia</option><option value="3">Parcial — recuperar em 3 dias</option><option value="4">Boa — recuperar em 7 dias</option><option value="5">Fácil — recuperar em 21 dias</option></select></div><button class="btn" type="submit">Registrar revisão</button></form></div>`}
function render(){let inner;if(selected){let t=T.find(x=>x.id===selected)||M.find(x=>x.id===selected)||K.find(x=>x.id===selected);if(t?.type==='tyson')inner=detailTyson(t);else if(t&&'mode'in t)inner=t.mode==='mapped'?mmm():detailMmm(t);else if(t&&'act'in t)inner=detailKkk(t);else if(reviewRef){inner=renderReviewDetail(T.find(x=>x.id===reviewRef))}else{selected=null;inner=home()}}else if(reviewRef){inner=renderReviewDetail(T.find(x=>x.id===reviewRef))}else{inner=({home,tyson,mmm,kkk,diary:renderDiary,review:renderReview,settings:renderSettings}[screen]||home)()}shell(inner);if(screen==='tyson'&&!selected&&search)filterSearch()}
function open(id){const x=T.find(y=>y.id===id)||M.find(y=>y.id===id)||K.find(y=>y.id===id);if(!x){toast('Registro sem correspondência neste currículo.',true);return}reviewRef=null;selected=id;rate=3;stopTimer();remain=(x.minutes||12)*60;minutes=x.minutes||12;screen=x.type==='tyson'?'tyson':x.mode?'mmm':'kkk';render();window.scrollTo(0,0)}
function stopTimer(){if(runTimer)clearInterval(runTimer);runTimer=null;ticking=false}
function tick(){if(remain>0)remain--;if(remain<=0){stopTimer();toast('Tempo sugerido concluído. Registre quando desejar.')}let c=$('#clock');if(c)c.textContent=fmtTime(remain)}
function addLog(kind,ref,note,extra={}){db.logs.push({id:uniq(),kind,ref,note,at:now(),...extra});save()}
function finishPractice(form){const kind=form.dataset.kind,ref=form.dataset.ref,note=$('#practice-notes').value.trim();if(note.length<10){toast('Registre ao menos 10 caracteres.',true);return}addLog(kind,ref,note,{rating:rate});if(kind==='tyson'){db.tysonDone[ref]={date:now(),rating:rate};db.reviews[ref]={due:dayAdd(1),stage:0}}else db.mmmDone[ref]={date:now(),rating:rate};save();stopTimer();toast('Prática registrada.');selected=null;render();window.scrollTo(0,0)}
function updatePlan(){let id=selected,p=db.ops[id]||{};p.goal=$('#op-goal').value.trim();p.criteria=$('#op-criteria').value.trim();p.started=p.started||now();db.ops[id]=p;db.started=db.started||now();save();toast('Plano salvo.');render()}
function opLog(){let ref=selected,note=$('#op-note').value.trim();if(note.length<12){toast('Descreva a tentativa com pelo menos 12 caracteres.',true);return}let event=$('#op-type').value,outcome=$('#op-outcome').value;addLog('operation',ref,note,{event,outcome});db.started=db.started||now();const p=db.ops[ref]||{};p.started=p.started||now();db.ops[ref]=p;save();toast('Registro adicionado.');render()}
function opComplete(){let k=K.find(x=>x.id===selected);if(!k||!levelUnlocked(k.level))return;let p=db.ops[k.id]||{};if(p.completed){p.completed=null;db.ops[k.id]=p;save();toast('Operação reaberta.');render();return}
 let log=db.logs.filter(l=>l.kind==='operation'&&l.ref===k.id);let attempt=log.some(l=>l.event==='tentativa');let result=log.some(l=>l.event==='resultado'&&['subjetivo','observado'].includes(l.outcome));if(!attempt||!result){toast('Registre uma tentativa e ao menos um resultado relevante, classificado e documentado.',true);return}if(k.number===25){let start=new Date(db.started||now()),deadline=new Date(start);deadline.setFullYear(deadline.getFullYear()+1);if(new Date()<deadline){toast('O Liber KKK prevê pelo menos um ano de trabalho integral antes do encerramento.',true);return}}p.completed=now();db.ops[k.id]=p;save();toast('Operação finalizada.');render()}
function filterSearch(){let q=search.trim().toLowerCase();document.querySelectorAll('.exercise[data-search]').forEach(el=>{el.hidden=!!q&&!el.dataset.search.includes(q);el.style.display=el.hidden?'none':''});document.querySelectorAll('.unit').forEach(u=>u.style.display=[...u.querySelectorAll('.exercise')].some(x=>!x.hidden)?'':'none')}
function download(content,filename,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportBackup(){download(JSON.stringify({...db,exportedAt:now()},null,2),'limiar-backup-v3-'+today()+'.json','application/json;charset=utf-8');toast('Backup preparado para download.')}
async function importBackup(f){if(!f)return;if(f.size>10_000_000){toast('Arquivo de backup muito grande.',true);return}try{let j=JSON.parse(await f.text()),obj=isV3(j)?j:migrate(j);if(!isV3(obj)||obj.logs.length>50000)throw Error('invalid');if(!confirm('Substituir os dados atuais pelos dados do backup?'))return;db=obj;save();upScreen('home');toast('Backup importado.') }catch(e){toast('Backup inválido ou incompatível.',true)}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el||el.disabled)return;let a=el.dataset.act,id=el.dataset.id;switch(a){case 'nav':reviewRef=null;upScreen(id);break;case 'open':open(id);break;case 'level':level=Number(id);selected=null;render();break;case 'rate':rate=Number(id);document.querySelectorAll('.scale button').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));break;case 'timer-toggle':if(ticking){stopTimer();el.textContent='Iniciar'}else{if(remain<=0)remain=minutes*60;ticking=true;runTimer=setInterval(tick,1000);el.textContent='Pausar'}break;case 'timer-reset':stopTimer();remain=minutes*60;let clock=$('#clock');if(clock)clock.textContent=fmtTime(remain);let btn=$('[data-act="timer-toggle"]');if(btn)btn.textContent='Iniciar';break;case 'op-complete':opComplete();break;case 'review-open':reviewRef=id;selected=null;screen='review';render();window.scrollTo(0,0);break;case 'export':exportBackup();break;case 'import':$('#import-file')?.click();break;case 'reset':if(confirm('Apagar TODOS os dados do Limiar 3 neste navegador? Recomenda-se exportar primeiro.')){db=empty();save();upScreen('home');toast('Dados da versão 3 apagados.')}break;}});
document.addEventListener('submit',e=>{if(!['practice-form','plan-form','op-log-form','review-form'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='practice-form')finishPractice(e.target);if(e.target.id==='plan-form')updatePlan();if(e.target.id==='op-log-form')opLog();if(e.target.id==='review-form'){let ref=reviewRef,note=$('#review-notes').value.trim(),n=Number($('#review-grade').value);if(note.length<8)return;addLog('review',ref,note,{rating:n});db.reviews[ref]={due:dayAdd(n===1?1:n),stage:n};save();reviewRef=null;upScreen('review');toast('Revisão salva.')}});
document.addEventListener('change',e=>{if(e.target.id==='chapter-filter'){chapter=Number(e.target.value);render()}if(e.target.id==='import-file'){importBackup(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='exercise-search'){search=e.target.value;filterSearch()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ticking){stopTimer();let btn=$('[data-act="timer-toggle"]');if(btn)btn.textContent='Iniciar'}});
window.__LIMIAR_CHECK__=()=>({tyson:T.length,mmm:M.length,mmmNew:M.filter(m=>m.mode==='new').length,kkk:K.length,tysonDone:nDone(),opsDone:nOps(),stored:!!localStorage.getItem(KEY)});
render();
if(location.protocol==='https:'||location.hostname==='localhost'){if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script></body></html>
